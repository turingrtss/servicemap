<!DOCTYPE html>
<html>
<head>
    <title>Service Dependency Map</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        #network { width: 100%; height: 600px; border: 1px solid #ddd; }
        h1 { color: #333; }
        .info { margin: 20px 0; padding: 10px; background: #f5f5f5; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Service Dependency Map</h1>
    <div class="info">
        <strong>Services:</strong> 3 &nbsp;|&nbsp;
        <strong>Dependencies:</strong> 8 &nbsp;|&nbsp;
        <strong>Total Calls:</strong> 8
    </div>
    <div id="network"></div>
    <script>
        var nodes = new vis.DataSet([{"id": 0, "label": "api-gateway", "color": "#2ecc71", "shape": "ellipse"}, {"id": 1, "label": "order-service", "color": "#2ecc71", "shape": "ellipse"}, {"id": 2, "label": "user-service", "color": "#2ecc71", "shape": "ellipse"}]);
        var edges = new vis.DataSet([{"from": 0, "to": 2, "value": 1, "label": "1"}, {"from": 0, "to": 1, "value": 1, "label": "1"}]);
        var container = document.getElementById('network');
        var data = { nodes: nodes, edges: edges };
        var options = {
            edges: {
                arrows: 'to',
                smooth: { type: 'cubicBezier' }
            },
            physics: {
                enabled: true,
                solver: 'forceAtlas2Based'
            }
        };
        var network = new vis.Network(container, data, options);
    </script>
</body>
</html>
